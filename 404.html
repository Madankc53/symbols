<style>
:root{--cream:#FBF3E6;--maroon:#7E2A2A;--maroon-dark:#5C1E1E;--gold:#D89B3C;--ink:#2A241D;--soft:#5A4F40;--rule:#D8C6A8}
@media (prefers-color-scheme:dark){:root{--cream:#1d1814;--maroon:#e3a35a;--maroon-dark:#f0d9b5;--ink:#f3e9d9;--soft:#c9bba5;--rule:#4a3f33}}

body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,-apple-system,'Segoe UI','Noto Sans Devanagari',sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}

p{color:var(--soft);margin:0 0 16px}
form{display:flex;gap:8px;margin:20px 0}
input{flex:1;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;font:inherit;background:transparent;color:var(--ink)}
button{padding:12px 18px;border:0;border-radius:8px;background:var(--maroon);color:#fff;font:inherit;font-weight:600;cursor:pointer}
a{color:var(--maroon)}

</head>
